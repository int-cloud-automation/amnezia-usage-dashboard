<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#151c28" />
  <title>Login · Amnezia Usage Dashboard</title>
  <link rel="icon" href="/static/favicon.svg?v={{ asset_v }}" type="image/svg+xml" />
  <link rel="icon" href="/static/favicon.png?v={{ asset_v }}" type="image/png" />
  <link rel="shortcut icon" href="/favicon.ico?v={{ asset_v }}" />
  <link rel="apple-touch-icon" href="/static/favicon.png?v={{ asset_v }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v={{ asset_v }}" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Amnezia</h1>
      <p>Usage Dashboard</p>
      {% if error %}
      <div class="error-banner">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <label class="field">Username
          <input name="username" autocomplete="username" required autofocus />
        </label>
        <label class="field">Password
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="btn primary" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
